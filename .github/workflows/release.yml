name: Release

# Attaches the OpenAI plugin archive to a GitHub Release for each version tag.
# OpenAI's plugin directory accepts only uploads, so this is the file to upload
# at https://platform.openai.com/plugins after a new version. The tags come from
# the publish workflow in openpath-sh/openpath, which leaves this folder alone.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v1.10.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Build the OpenAI archive
        run: |
          version="${TAG#v}"
          mkdir -p build/openai
          # The Agent Plugins manifest at the root carries the OpenAI listing:
          # name, subtitle, category, URLs, prompts, and the icons in assets/.
          # .claude-plugin/ is for Claude, so it stays out.
          # README.md is optional: the mirror no longer carries one.
          cp -R plugin.json skills assets LICENSE build/openai/
          # Gemini CLI installs from a release's archive when there is one, so
          # the same archive carries its manifest at the root.
          if [ -f gemini-extension.json ]; then cp gemini-extension.json build/openai/; fi
          if [ -f README.md ]; then cp README.md build/openai/; fi
          (cd build/openai && zip -q -r -X "../openpath-openai-${version}.zip" .)
          echo "ARCHIVE=build/openpath-openai-${version}.zip" >> "${GITHUB_ENV}"
          unzip -l "build/openpath-openai-${version}.zip"

      - name: Publish the release
        run: |
          if gh release view "${TAG}" > /dev/null 2>&1; then
            gh release upload "${TAG}" "${ARCHIVE}" --clobber
          else
            gh release create "${TAG}" "${ARCHIVE}" --verify-tag \
              --title "Openpath skill ${TAG#v}" \
              --notes "Upload \`$(basename "${ARCHIVE}")\` to OpenAI's plugin directory at https://platform.openai.com/plugins (Skills only). It is the only Openpath listing that takes a manual upload."
          fi
